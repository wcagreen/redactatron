name: Release Redactatron 9000

on:
  push:
    tags:
      - 'redactatron-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: redactatron-linux-x64
            binary: redactatron
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: redactatron-linux-x64-musl
            binary: redactatron
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: redactatron-linux-arm64
            binary: redactatron
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: redactatron-windows-x64
            binary: redactatron.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            name: redactatron-macos-x64
            binary: redactatron
          - target: aarch64-apple-darwin
            os: macos-latest
            name: redactatron-macos-arm64
            binary: redactatron

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: |
          cargo build --release --target ${{ matrix.target }} -p redactor-ui

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.binary }}
          echo "ASSET_PATH=target/${{ matrix.target }}/release/${{ matrix.name }}.tar.gz" >> $GITHUB_ENV
          echo "ASSET_NAME=${{ matrix.name }}.tar.gz" >> $GITHUB_ENV
      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ matrix.name }}.zip ${{ matrix.binary }}
          echo "ASSET_PATH=target/${{ matrix.target }}/release/${{ matrix.name }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "ASSET_NAME=${{ matrix.name }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload binary to release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -la ./artifacts

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/redactatron-v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Redactatron 9000 v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./artifacts/**/*
          body: |
            ## Redactatron 9000 v${{ steps.version.outputs.version }}
            
            A fast and reliable tool for redacting sensitive information in PDF, document and image files.
            
            ### Features
            - Support for PDF, DOCX, and Images 
            - Interactive UI for marking redaction areas
            - Page-by-page navigation and editing
            - Search functionality to find and redact terms
            
            ### Downloads
            
            Choose the appropriate binary for your system:
            
            - **Linux (x64)**: `redactatron-linux-x64.tar.gz`
            - **Linux (ARM64)**: `redactatron-linux-arm64.tar.gz` 
            - **Linux (musl)**: `redactatron-linux-x64-musl.tar.gz`
            - **macOS (Intel)**: `redactatron-macos-x64.tar.gz`
            - **macOS (Apple Silicon)**: `redactatron-macos-arm64.tar.gz`
            - **Windows**: `redactatron-windows-x64.zip`
            
