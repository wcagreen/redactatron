[workspace]
members = ["redactor-core", "redactor-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["William Green"]
edition = "2024"
license = "MIT"
repository = "https://github.com/wcagreen/rusty-redactor"


[workspace.dependencies]
serde = "1.0.228"
serde_json = "1.0.147"
tempfile = "3.24.0"
log = "0.4.29"
env_logger = "0.11.8"
directories = "6.0.0"
image = "0.25.9"
anyhow = "1.0.100"
redactor-core = { version = "0.1.0", path="./redactor-core"}